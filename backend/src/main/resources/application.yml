spring:
  application:
    name: mnp-portability

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mnp}
    username: ${DB_USERNAME:mnp}
    password: ${DB_PASSWORD:mnp}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

porting:
  request-timeout: 2m
  timeout-check-interval: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html