services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mnp}
      MYSQL_USER: ${MYSQL_USER:-mnp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mnp}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"      # for DB clients on the host; the app talks to mysql:3306 internally
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 forces TCP: the temporary server used during first-time init only listens on a socket,
      # so this reports healthy only once the real server is up.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mnp}
      DB_USERNAME: ${MYSQL_USER:-mnp}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mnp}
      # Spring's env-var form of porting.request-timeout and porting.timeout-check-interval.
      PORTING_REQUESTTIMEOUT: ${PORTING_REQUEST_TIMEOUT:-2m}
      PORTING_TIMEOUTCHECKINTERVAL: ${PORTING_TIMEOUT_CHECK_INTERVAL:-15s}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    healthcheck:
      # 127.0.0.1, not localhost: nginx here listens on IPv4 only.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data: